name: Build SM64 Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git libusb-1.0-0-dev libsdl2-dev python3 libaudiofile-dev bsdmainutils

      - name: Check and Prepare Base ROM
        run: |
          # Garante a ROM tanto na raiz quanto em app/jni/src
          if [ -f "app/jni/src/baserom.us.z64" ]; then
            cp app/jni/src/baserom.us.z64 ./baserom.us.z64
          elif [ -f "./baserom.us.z64" ]; then
            mkdir -p app/jni/src
            cp ./baserom.us.z64 app/jni/src/baserom.us.z64
          else
            echo "ERRO: baserom.us.z64 nao encontrada!"
            exit 1
          fi

          echo "ROM encontrada com sucesso:"
          ls -lh app/jni/src/baserom.us.z64
          sha1sum app/jni/src/baserom.us.z64

      - name: Get SDL Sources
        run: |
          if [ -f "./getSDL.sh" ]; then
            chmod +x ./getSDL.sh
            ./getSDL.sh
          fi

      - name: Build Native SM64 Core
        run: |
          if [ -d "app/jni/src" ] && [ -f "app/jni/src/Makefile" ]; then
            cd app/jni/src
            make --jobs $(nproc)
            cd ../../..
          else
            make --jobs $(nproc)
          fi

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64-android-apk
          path: app/build/outputs/apk/debug/*.apk
