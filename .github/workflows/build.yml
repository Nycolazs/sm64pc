name: Build SM64 Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git libusb-1.0-0-dev libsdl2-dev python3 bsdmainutils zip libaudiofile-dev zipalign apksigner

      - name: Prepare Base ROM
        run: |
          if [ -f "app/jni/src/baserom.us.z64" ]; then
            cp app/jni/src/baserom.us.z64 ./baserom.us.z64
          fi

          if [ ! -f "./baserom.us.z64" ]; then
            echo "ERRO: baserom.us.z64 nao encontrada!"
            exit 1
          fi

          ls -lh ./baserom.us.z64

      - name: Download SDL Dependencies
        run: |
          if [ -f "./getSDL.sh" ]; then
            chmod +x ./getSDL.sh
            ./getSDL.sh
          fi

      - name: Compile and Build APK
        run: |
          export ANDROID_NDK="${ANDROID_NDK_ROOT}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_ROOT}"
          export NDK="${ANDROID_NDK_ROOT}"
          
          # Executa o target apk explicitamente
          make TARGET_ANDROID=1 apk --jobs $(nproc)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64-android-apk
          path: build/us_pc/*.apk
          if-no-files-found: error
