name: Build SM64 Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git libusb-1.0-0-dev libsdl2-dev python3 bsdmainutils zip libaudiofile-dev

      - name: Verify Base ROM
        run: |
          # Procura a ROM na raiz ou dentro de app/jni/src e garante na raiz
          if [ -f "app/jni/src/baserom.us.z64" ]; then
            cp app/jni/src/baserom.us.z64 ./baserom.us.z64
          fi

          if [ ! -f "./baserom.us.z64" ]; then
            echo "ERRO: baserom.us.z64 nao encontrada na raiz do repositorio!"
            exit 1
          fi

          echo "ROM encontrada:"
          ls -lh ./baserom.us.z64
          sha1sum ./baserom.us.z64

      - name: Download SDL Dependencies
        run: |
          if [ -f "./getSDL.sh" ]; then
            chmod +x ./getSDL.sh
            ./getSDL.sh
          fi

      - name: Compile Game & Generate APK
        run: |
          # O make desse projeto compila e empacota o APK diretamente
          make --jobs $(nproc)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64-android-apk
          path: build/us_pc/*.apk
